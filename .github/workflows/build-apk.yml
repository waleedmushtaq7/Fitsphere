name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK
        run: >
          dotnet build FitSphere.csproj -f net10.0-android -c Debug
          -p:EmbedAssembliesIntoApk=true
          -p:AndroidPackageFormat=apk
          -p:InstallAndroidDependencies=true
          -p:AndroidSdkDirectory=$ANDROID_HOME
          -p:AcceptAndroidSDKLicenses=true
          -clp:ErrorsOnly

      - name: Find the APK
        run: |
          find . -name "*.apk" -path "*Debug*"
          mkdir -p apk-out
          cp $(find . -name "*-Signed.apk" | head -1) apk-out/FitSphere.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: FitSphere-apk
          path: apk-out/FitSphere.apk
